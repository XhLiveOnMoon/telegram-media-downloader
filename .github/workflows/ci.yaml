name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: python -m compileall -q app
      - name: Import application modules
        run: python -c "import app.bot, app.downloader, app.__main__"
      - name: Validate Compose configuration
        run: cp .env.example .env && docker compose config --quiet
      - name: Build Docker image
        run: docker build -t telegram-media-downloader:ci .
