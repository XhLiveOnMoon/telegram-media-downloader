[project]
name = "telegram-media-downloader"
version = "0.1.0"
description = "A private, manually triggered Telegram media downloader bot backed by Telethon."
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.13,<4",
  "Telethon>=1.37,<2",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.7,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
